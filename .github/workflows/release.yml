# Cutting a release: bump the version, commit, tag.
#   bun scripts/version.ts set 0.2.0 && git commit -am "release: 0.2.0" && git tag v0.2.0 && git push --follow-tags
# Pushing the tag verifies the version, runs the tests, publishes the Docker images and the signed APK,
# and creates the GitHub Release. See docs/releasing.md.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: The tag matches the version in every file
        run: bun scripts/version.ts verify "$GITHUB_REF_NAME"
      - name: The tag is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main. Merge first, then tag the merge commit."; exit 1; }
      - id: meta
        run: bun scripts/version.ts meta >> "$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun test backend shared web scripts

  docker:
    name: Docker images
    needs: verify
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/docker.yml

  android:
    name: Android APK
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/android.yml
    secrets: inherit

  release:
    name: GitHub Release
    needs: [verify, docker, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: android-release
          path: dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cat > notes-footer.md <<NOTES

          ## Install

          **Docker** (amd64 and arm64)
          \`\`\`
          docker pull ghcr.io/${owner}/koremind-backend:${VERSION}
          docker pull ghcr.io/${owner}/koremind-web:${VERSION}
          \`\`\`
          See \`deploy/docker-compose.yml\` and \`docs/deployment-docker.md\`.

          **Android**: download \`koremind-android-${VERSION}.apk\` below and install it. Check it with the \`.sha256\` file.
          NOTES
          flags=(--verify-tag --generate-notes --notes-file notes-footer.md --title "KoreMind ${VERSION}")
          [ "$PRERELEASE" = "true" ] && flags+=(--prerelease) || flags+=(--latest)
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
